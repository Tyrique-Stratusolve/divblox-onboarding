<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Fibonacci Sequence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            color: #58a6ff;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .array-badge {
            display: inline-block;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 16px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 1.1rem;
            color: #f0f6fc;
            margin-bottom: 24px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .result-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
        }

        .result-card .label {
            font-size: 0.8rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .result-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'SF Mono', 'Fira Code', monospace;
            word-break: break-all;
            overflow: break-word;
        }

        .result-card .value.pass {
            color: #3fb950;
        }

        .result-card .value.fail {
            color: #f85149;
        }

        .result-card .desc {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 4px;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        .error {
            color: #f85149;
            margin-top: 16px;
        }

        #displayTxt {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Task 4 — groupByOwner</h1>
        
        <div class="array-badge">
            <select bame="owners" id="ownersDropdown">
                <option value="Andy">Andy</option>
                <option value="Bob">Bob</option>
                <option value="Candice">Candice</option>
            </select>
        </div>

        <div class="results-grid" id="resultsGrid">
            <div class="result-card">
                <div class="label">equipment owned:</div>
                <div class="value" id="displayEquipment">—</div>
            </div>
        </div>

        <button id="actionBtn">▶ Show equipment</button>
        <p class="error" id="errorDisplay"></p>
    </div>

    <script src="../js/functions.js"></script>
</body>

</html>
