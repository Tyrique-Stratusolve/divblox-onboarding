info:
  name: CreatePerson
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/people
  body:
    type: json
    data: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "dateOfBirth": "2001-05-10",
        "emailAddress": "johndoe@example.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
