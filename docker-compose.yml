services:
  mysql:
    container_name: dvblx-db
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --lower_case_table_names=1
      - --sql_mode=
    environment:
      MYSQL_ROOT_PASSWORD: "dev_password"
      MYSQL_DATABASE: "divblox-onboarding"
      MYSQL_USER: "dxuser"
      MYSQL_PASSWORD: "secret"

volumes:
  database_data:
